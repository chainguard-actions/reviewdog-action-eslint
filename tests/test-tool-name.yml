name: Test custom tool_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install eslint in test project
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-project"
          npm install

      - name: Set up fake reviewdog that records its arguments
        run: |
          FAKE_BIN_DIR="$GITHUB_WORKSPACE/tests/fake-bin-toolname"
          mkdir -p "$FAKE_BIN_DIR"

          # Fake reviewdog records its arguments to a file for assertion
          cat > "$FAKE_BIN_DIR/reviewdog" << 'EOF'
          #!/bin/sh
          echo "$@" > /tmp/reviewdog-args.txt
          cat > /dev/null
          exit 0
          EOF
          chmod +x "$FAKE_BIN_DIR/reviewdog"

          FAKE_RD="$FAKE_BIN_DIR/reviewdog"
          cat > /tmp/fake-reviewdog-install-toolname.sh << INSTALLEOF
          #!/bin/sh
          BINDIR="."
          while [ \$# -gt 0 ]; do
            case "\$1" in
              -b) BINDIR="\$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          mkdir -p "\$BINDIR"
          cp "${FAKE_RD}" "\$BINDIR/reviewdog"
          chmod +x "\$BINDIR/reviewdog"
          INSTALLEOF
          chmod +x /tmp/fake-reviewdog-install-toolname.sh

          # Fake curl - supports both pipe and -o forms
          cat > "$FAKE_BIN_DIR/curl" << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-reviewdog-install-toolname.sh > "$out"
              else
                cat /tmp/fake-reviewdog-install-toolname.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x "$FAKE_BIN_DIR/curl"

          echo "$FAKE_BIN_DIR" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          tool_name: my-custom-eslint
          eslint_flags: "index.js --no-eslintrc -c ${{ github.workspace }}/tests/fixtures/eslint-project/.eslintrc.json"
          workdir: "tests/fixtures/eslint-project"

      - name: Assert reviewdog was called with custom tool name
        run: |
          echo "Reviewdog args:"
          cat /tmp/reviewdog-args.txt || echo "(file not found)"
          if grep -q "my-custom-eslint" /tmp/reviewdog-args.txt; then
            echo "PASS: reviewdog was called with tool_name=my-custom-eslint"
          else
            echo "FAIL: expected reviewdog to be called with -name=my-custom-eslint"
            cat /tmp/reviewdog-args.txt
            exit 1
          fi
