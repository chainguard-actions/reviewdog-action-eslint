name: Test fail_level=none with eslint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install eslint in test project
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-project"
          npm install

      - name: Set up fake reviewdog and curl
        run: |
          FAKE_BIN_DIR="$GITHUB_WORKSPACE/tests/fake-bin-fail-level"
          mkdir -p "$FAKE_BIN_DIR"

          # Fake reviewdog exits 0 regardless of issues (simulating fail_level=none)
          cat > "$FAKE_BIN_DIR/reviewdog" << 'EOF'
          #!/bin/sh
          cat > /dev/null
          echo "reviewdog: issues found but fail_level=none so exit 0 (fake)"
          exit 0
          EOF
          chmod +x "$FAKE_BIN_DIR/reviewdog"

          # Create a fake install.sh
          FAKE_RD="$FAKE_BIN_DIR/reviewdog"
          cat > /tmp/fake-reviewdog-install-fail.sh << INSTALLEOF
          #!/bin/sh
          BINDIR="."
          while [ \$# -gt 0 ]; do
            case "\$1" in
              -b) BINDIR="\$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          mkdir -p "\$BINDIR"
          cp "${FAKE_RD}" "\$BINDIR/reviewdog"
          chmod +x "\$BINDIR/reviewdog"
          INSTALLEOF
          chmod +x /tmp/fake-reviewdog-install-fail.sh

          # Fake curl - supports both pipe and -o forms
          cat > "$FAKE_BIN_DIR/curl" << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-reviewdog-install-fail.sh > "$out"
              else
                cat /tmp/fake-reviewdog-install-fail.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x "$FAKE_BIN_DIR/curl"

          echo "$FAKE_BIN_DIR" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: warning
          eslint_flags: "bad.js --no-eslintrc -c ${{ github.workspace }}/tests/fixtures/eslint-project/.eslintrc-errors.json"
          workdir: "tests/fixtures/eslint-project"

      - name: Assert action completed with exit 0 (fail_level=none)
        run: |
          echo "PASS: action completed with exit 0 as expected when fail_level=none"
