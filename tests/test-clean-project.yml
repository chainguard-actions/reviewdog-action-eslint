name: Test clean project passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/eslint-clean
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action succeeded and eslint was installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -x tests/fixtures/eslint-clean/node_modules/.bin/eslint ]; then
            echo "FAIL: eslint was not installed via npm install in workdir"
            exit 1
          fi
          echo "PASS"
