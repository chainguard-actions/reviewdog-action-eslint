name: Test eslint configuration error fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/eslint-clean
          reporter: local
          filter_mode: nofilter
          fail_level: none
          eslint_flags: "--this-flag-does-not-exist ."
      - name: Assert action failed even though fail_level=none
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure from eslint exit code 2"
            exit 1
          fi
          echo "PASS"
