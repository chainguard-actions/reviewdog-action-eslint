name: Test eslint_flags restricts linted files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/eslint-errors
          reporter: local
          filter_mode: nofilter
          fail_level: any
          eslint_flags: "good.js"
          tool_name: eslint-custom
      - name: Assert action succeeded (only good.js linted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when only good.js is linted"
            exit 1
          fi
          echo "PASS"
