name: Test eslint with errors - fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install npm dependencies for action
        run: npm install
        working-directory: .

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          eslint_flags: 'testdata/error.js'
          workdir: '.'
          tool_name: eslint-test-errors

      - name: Assert action exited 0 with fail_level none
        run: |
          echo "PASS: action exited 0 even with eslint errors when fail_level=none"
