name: Test eslint run with errors (fail_level none)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake binaries (npx outputs errors, fail_level=none)
        run: |
          # Copy fake install script to /tmp
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-reviewdog-install.sh" /tmp/fake-reviewdog-install.sh
          chmod +x /tmp/fake-reviewdog-install.sh

          # Install fake curl and fake npx-errors to /usr/local/bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" /usr/local/bin/curl \
            || sudo cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" /usr/local/bin/curl
          chmod +x /usr/local/bin/curl \
            || sudo chmod +x /usr/local/bin/curl
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-npx-errors" /usr/local/bin/npx \
            || sudo cp "$GITHUB_WORKSPACE/tests/fixtures/fake-npx-errors" /usr/local/bin/npx
          chmod +x /usr/local/bin/npx \
            || sudo chmod +x /usr/local/bin/npx

          which curl
          which npx

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: error
          eslint_flags: '.'
          workdir: '.'
          tool_name: 'eslint-test-errors'

      - name: Assert action completed (fail_level none means exit 0 even with errors)
        run: |
          echo "Action completed with fail_level=none even though eslint found errors"
          echo "PASS"
