name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install eslint in fixture project directory
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-project"
          npm install

      - name: Create fake reviewdog binary that captures its arguments
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/reviewdog << 'EOF'
          #!/bin/sh
          # Fake reviewdog: capture args and write to a file for assertion
          cat > /dev/null
          echo "$@" > /tmp/reviewdog-args.txt
          echo "fake reviewdog args: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-bin/reviewdog

      - name: Create fake install script for reviewdog
        run: |
          cat > /tmp/fake-install-reviewdog.sh << 'EOF'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            if [ "$prev" = "-b" ]; then
              BINDIR="$arg"
            fi
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            mkdir -p "$BINDIR"
            cp /tmp/fake-bin/reviewdog "$BINDIR/reviewdog"
          fi
          echo "fake install done"
          EOF
          chmod +x /tmp/fake-install-reviewdog.sh

      - name: Create fake curl
        run: |
          mkdir -p /tmp/mock-curl
          cat > /tmp/mock-curl/curl << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x /tmp/mock-curl/curl
          echo "/tmp/mock-curl" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: warning
          tool_name: my-eslint
          eslint_flags: 'clean.js'
          workdir: 'tests/fixtures/eslint-project'

      - name: Assert reviewdog was called with correct tool name and level
        run: |
          echo "Checking reviewdog args..."
          if [ -f /tmp/reviewdog-args.txt ]; then
            ARGS=$(cat /tmp/reviewdog-args.txt)
            echo "reviewdog args: $ARGS"
            if echo "$ARGS" | grep -q "my-eslint"; then
              echo "PASS: tool_name 'my-eslint' was passed to reviewdog"
            else
              echo "FAIL: expected tool_name 'my-eslint' in reviewdog args"
              exit 1
            fi
            if echo "$ARGS" | grep -q "warning"; then
              echo "PASS: level 'warning' was passed to reviewdog"
            else
              echo "FAIL: expected level 'warning' in reviewdog args"
              exit 1
            fi
          else
            echo "FAIL: reviewdog args file not found - reviewdog may not have been called"
            exit 1
          fi
