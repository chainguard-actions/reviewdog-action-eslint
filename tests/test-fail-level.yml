name: Test fail_level with errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install eslint in fixture project directory
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-project"
          npm install

      - name: Create fake reviewdog binary that exits 1 when fail-level is set and input is non-empty
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/reviewdog << 'EOF'
          #!/bin/sh
          # Fake reviewdog: read stdin, check fail-level flag
          INPUT=$(cat)
          FAIL_LEVEL="none"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -fail-level) FAIL_LEVEL="$arg" ;;
            esac
            prev="$arg"
          done
          echo "fake reviewdog: fail-level=$FAIL_LEVEL input_len=${#INPUT}"
          # If fail-level is not none and there is diagnostic content, exit 1
          if [ "$FAIL_LEVEL" != "none" ] && echo "$INPUT" | grep -q '"diagnostics":\[{'; then
            echo "fake reviewdog: found issues, exiting 1"
            exit 1
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-bin/reviewdog

      - name: Create fake install script for reviewdog
        run: |
          cat > /tmp/fake-install-reviewdog.sh << 'EOF'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            if [ "$prev" = "-b" ]; then
              BINDIR="$arg"
            fi
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            mkdir -p "$BINDIR"
            cp /tmp/fake-bin/reviewdog "$BINDIR/reviewdog"
          fi
          echo "fake install done"
          EOF
          chmod +x /tmp/fake-install-reviewdog.sh

      - name: Create fake curl
        run: |
          mkdir -p /tmp/mock-curl
          cat > /tmp/mock-curl/curl << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x /tmp/mock-curl/curl
          echo "/tmp/mock-curl" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: error
          eslint_flags: 'bad.js'
          workdir: 'tests/fixtures/eslint-project'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and eslint errors present, the action may fail or succeed
          # depending on whether the fake reviewdog detects issues in the rdjson output.
          # Either outcome is acceptable - we just verify the action ran to completion.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
