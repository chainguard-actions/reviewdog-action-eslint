name: Test eslint fail_level error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install npm dependencies for action
        run: npm install
        working-directory: .

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          eslint_flags: 'testdata/error.js'
          workdir: '.'
          tool_name: eslint-test-fail-level

      - name: Assert action failed due to eslint errors with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when eslint finds errors with fail_level=error, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when eslint errors found with fail_level=error"
