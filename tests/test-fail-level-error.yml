name: Test fail_level=error causes failure when errors found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install eslint dependencies
        run: npm install

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-local-reporter
          reporter: local
          filter_mode: nofilter
          fail_level: error
          eslint_flags: testdata/error.js
          workdir: .

      - name: Assert action failed due to eslint errors with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=error and eslint errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when eslint errors found with fail_level=error"
